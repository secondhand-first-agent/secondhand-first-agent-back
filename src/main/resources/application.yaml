spring:
  application:
    name: second-hand-first
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  # AI 서버가 백엔드 내부 상품 검색 API를 호출할 때 쓰는 선택적 공유 키.
  # 비어 있으면 로컬 개발을 위해 검사를 생략한다.
  internal-api-key: ${BACKEND_API_KEY:}
  auth:
    jwt-secret: ${JWT_SECRET:second-hand-first-local-secret-key-change-me}
    access-token-seconds: 3600
    refresh-token-seconds: 1209600
    cookie-secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# AI 서버. base-url 이 없으면 검색이 502로 끝난다 — 주소를 모르는 상태에서
# 임의의 분석 결과를 만들지 않는다.
ai:
  base-url: ${AI_BASE_URL:}
  # AI 서버에 AI_API_KEY 가 설정돼 있으면 같은 값을 넣어야 한다.
  api-key: ${AI_API_KEY:}

kakao:
  local:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY}
